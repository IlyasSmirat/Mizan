<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mizan</title>
    <link rel="stylesheet" href="styles.css">
    <script type="module" src="app.js"></script>
</head>
<body>
    <div id="intro">
        <h1>Mizan</h1>
        <p>Mizan : les cours de l’or et de l’argent en dirhams, mis à jour en continu, avec estimation instantanée de la valeur d’un bijou au gramme. Un outil de lecture simple et fiable</p>
    </div>
    <div id="currency-selector">
        <label for="devise">Choix de devise :</label>
        <select id="devise">
            <option value="USD">USD</option>
            <option value="EUR">EUR</option>
            <option value="MAD">MAD</option>
        </select>
    </div>
    <div id="cards"></div>
        <div id="request-status">
            <p id="status-message"></p>
            <button id="retry-button" type="button" hidden>
                Réessayer
            </button>
        </div>
    <template id="metalTemplate">
        <div class="metal-card">
            <h2 class="metal-name"></h2>
            <p class="metal-price"></p>
            <p class="metal-update"></p>
            <p class="metal-variation"></p>
            <p class="metal-percentage"></p>
        </div>
    </template>
    <div id="history">
        <h2>Historique des prix</h2>

        <select id="metal-select">
            <option value="xau">Or</option>
            <option value="silver">Argent</option>
        </select>
        <select id="range-select">
            <option value="7d">7 jours</option>
            <option value="1mo">30 jours</option>
        </select>
        <canvas id="history-chart"></canvas>
    </div>
    <div id="estimator">
    <h2>Estimateur de bijoux</h2>

    <label for="poids">Poids (grammes) :</label>
    <input type="number" id="poids" step="any">

    <label for="metal-estimateur">Choisir le métal :</label>
    <select id="metal-estimateur">
        <option value="xau">Or</option>
        <option value="silver">Argent</option>
    </select>

    <p id="resultat-estimation"></p>
</div>
</body>
</html>
